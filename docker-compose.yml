# ============================================================
#  CarlaAir v0.1.7 — Docker Compose
# ============================================================
#  Prerequisites:
#    - NVIDIA GPU + nvidia-container-toolkit
#    - X11 display (remove volumes below for headless)
#
#  Usage:
#    docker compose up           # First run: clone + download ~17GB + launch
#    docker compose up -d        # Background
#    docker compose restart      # Fast restart (skip deploy)
#    docker compose down         # Stop & remove container (data kept in volume)
#    docker compose down -v      # Stop & delete everything
# ============================================================

services:
  carlaair:
    build:
      context: .
      dockerfile: Dockerfile
    image: carlaair:v0.1.7
    container_name: carlaair

    # ── NVIDIA GPU ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, graphics]

    # ── Network: host mode so Carla(2000) + AirSim(41451) are exposed ──
    network_mode: host

    # ── Environment ──
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - CARLA_PORT=2000
      - AIRSIM_PORT=41451
      - XDG_RUNTIME_DIR=/tmp

    # ── Volumes ──
    volumes:
      # Persistent project data (survives container rebuild)
      - carlaair_project:/workspace
      # X11 display
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # GPU rendering
      - /dev/dri:/dev/dri

    stdin_open: true
    tty: true
    command: ["Town10HD"]

volumes:
  carlaair_project:
